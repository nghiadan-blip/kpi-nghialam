server {
    listen 80;
    server_name kpi.nghialam.com;

    # Thư mục gốc chứa bộ Frontend đã build (Vite / React)
    root /var/www/kpi-app/client/dist;
    index index.html;

    # Nén Gzip tăng tốc độ tải trang trên mọi thiết bị
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Định tuyến ứng dụng React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp API Backend sang cổng 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout cho các tác vụ tính toán, xuất Excel báo cáo & gửi email
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Dung lượng tải lên tối đa
    client_max_body_size 50M;
}
